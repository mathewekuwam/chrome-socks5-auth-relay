<!doctype html>
<meta charset="utf-8">
<title>My Proxy Switch – Settings</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 460px; margin: 30px auto; padding: 0 16px; }
  label { display: block; margin-top: 14px; font-weight: 600; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; }
  button { margin-top: 18px; padding: 9px 18px; } small { color: #666; font-weight: 400; }
  #msg { margin-left: 10px; color: #188038; }
</style>
<h2>Relay settings</h2>
<p><small>The extension connects to your <b>local relay</b>, which holds the proxy username/password
(see relay/config.json). No credentials are stored in the browser.</small></p>
<label>Relay host <input id="host"></label>
<label>Relay port <input id="port" type="number"></label>
<label>Bypass list <small>(one per line)</small><textarea id="bypass" rows="5"></textarea></label>
<button id="save">Save</button><span id="msg"></span>
<script src="options.js"></script>
